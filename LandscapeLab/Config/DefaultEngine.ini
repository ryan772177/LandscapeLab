; >>> LANDSCAPELAB LANDSCAPE HLOD
; HLODMaxTextureSize clamps the landscape HLOD bake at
; LandscapeHLODBuilder.cpp:234, AFTER the per-proxy HLODTextureSize is read
; at :224. Engine default is 1024 (LandscapeSettings.h:137), and with
; HLODTextureSizePolicy=SpecificSize / HLODTextureSize=4096 on 256/256
; landscape proxies the cap was BINDING -- every landscape HLOD cell baked
; at 1024, measured off disk 2026-09-14 (FLATTEN_PATH_VERDICT.md).
; Raised to 4096 so R-HLODTEX's declared 4096 is the value that ships.
; ClampMax is 8192 (LandscapeSettings.h:136).
; :124 hashes this into the landscape HLOD hash, so changing it invalidates
; every landscape HLOD cell and forces their rebuild. That is intended.
[/Script/Landscape.LandscapeSettings]
HLODMaxTextureSize=4096
; <<< LANDSCAPELAB LANDSCAPE HLOD
