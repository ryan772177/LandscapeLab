; =====================================================================
; LOW-SPEC HARDWARE PROFILE  (added 2026-08-02)
; Target: Intel Core Ultra 5 225U integrated GPU, 15.4 GB RAM, 14 logical
; cores. Every value here is a deliberate trade of fidelity for the
; ability to keep an editor open at all -- this project has already lost
; the GPU to a TDR once (DXGI_ERROR_DEVICE_HUNG, docs/lessons.md 23.12).
;
; [SystemSettings] is the console-variable section: SystemSettings.cpp:31
; declares GIniSectionGame = "SystemSettings", and everything in it is
; applied at startup. This is the authoritative copy of these values --
; DefaultEditorPerProjectUserSettings.ini carries the editor-side
; equivalents, but a per-user config can shadow those and cannot shadow
; this.
; =====================================================================
[SystemSettings]

; --- scalability groups (0 = low ... 3 = epic) ---
sg.ViewDistanceQuality=1
sg.AntiAliasingQuality=1
sg.ShadowQuality=1
; RAISED 0 -> 3 on 2026-08-11. These two were the iGPU compromises that
; left the scene with NO GI and NO REFLECTIONS on a 5080. Lumen measured
; 38.2x the noise floor when switched on as render state, which is the
; largest single quality lever ever measured on this project.
sg.GlobalIlluminationQuality=3
sg.ReflectionQuality=3
sg.PostProcessQuality=1
sg.TextureQuality=1
sg.EffectsQuality=1
sg.FoliageQuality=1
sg.ShadingQuality=1

; --- VEGETATION DENSITY IS PINNED, and this is a correctness rule ---
;
; MEASURED 2026-08-02, and it changes what the sg.* lines above mean:
;   * BaseScalability.ini [FoliageQuality@1] sets grass.DensityScale=0.4
;     AND foliage.DensityScale=0.4 (Engine/Config/BaseScalability.ini:972).
;   * Setting sg.FoliageQuality from a CONSOLE command applies that group:
;     sg.FoliageQuality 0 -> both scales 0.0; sg.FoliageQuality 1 -> 0.4.
;   * But a fresh editor launched with sg.FoliageQuality=1 in THIS section
;     reported grass.DensityScale=1.0. So [SystemSettings] sets the sg.*
;     cvar VALUE without running the group. The group applies later if
;     anything touches the Scalability UI or issues a console set.
;
; That is a latent trap: vegetation would silently thin to 40% partway
; through a session, and a verification pass taken afterwards would be
; measuring suppressed vegetation without any indication.
;
; So the density scales are PINNED here explicitly, after the sg.* lines.
; Low scalability everywhere else; vegetation density stays truthful.
; If you ever want the scalability thinning back, delete these two lines
; deliberately -- do not rely on the group not having been applied.
grass.DensityScale=1.0
foliage.DensityScale=1.0
; And DRAW DISTANCE, same trap, same fix. BaseScalability.ini:116 —
; [ViewDistanceQuality@1] sets r.ViewDistanceScale=0.6, and that
; multiplies every per-primitive max draw distance. MEASURED: at launch
; it reads 1.0 (the group had not expanded); forcing the group with a
; console `sg.ViewDistanceQuality 1` drove it to 0.6.
;
; Unpinned, the recipe's 300 m tree cull would silently become 180 m the
; moment anything expanded the group, and a vegetation pass verified
; after that point would be measuring a shorter world than the recipe
; describes. The cull distances in recipes/*.json must mean what they
; say.
r.ViewDistanceScale=1.0

; =====================================================================
; LUMEN AND THE GI/REFLECTION GROUPS, PINNED DOWNSTREAM (2026-08-11)
;
; SAME TRAP AS grass.DensityScale ABOVE, AND IT IS WHY THESE LINES EXIST.
; This file already records the measurement: [SystemSettings] sets the
; sg.* cvar VALUE WITHOUT RUNNING THE GROUP. So raising
; sg.GlobalIlluminationQuality to 3 above stores a 3 and moves NOTHING —
; the Lumen quality cvars the group is supposed to expand to would sit at
; their defaults until something touched the Scalability UI.
;
; So the values BaseScalability.ini expands at @3 are pinned explicitly,
; exactly as the density scales are. Both are set, so the two agree and
; a later group expansion is idempotent rather than a silent revert.
;
; VERIFIED IN THE LIVE EDITOR 2026-08-11 by reading these DOWNSTREAM
; cvars, not by reading sg.* back at itself — reading back the thing you
; set proves only that it stored (non-negotiable 8).
;   [GlobalIlluminationQuality@3]  BaseScalability.ini
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.FinalGatherMethod=1
r.LumenScene.SurfaceCache.AtlasSize=4096
;   [ReflectionQuality@3]
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=1
r.SSR.Quality=3

; --- Lumen far-field GI for the distant HLOD proxy band (Brief 7 A2) ---
; The far WorldPartitionHLOD proxies render BLACK/dark at distance: they are
; lit materials (MSM_DEFAULT_LIT, verified 2026-09-24) but sit beyond Lumen's
; near-field screen trace, and with r.LumenScene.FarField=0 and software SDF
; tracing off they receive neither indirect nor a far-field trace. Enabling
; the far-field trace gives the distant band GI (RT-on-proxies + sky already
; on). MaxTraceDistance already reads 1,000,000 (inert while this was off).
; Ref: research/brief7/p1_amendments.md A2. Pinned here (not the group) for
; the same reason as the Lumen cvars above -- [SystemSettings] stores the
; value without expanding a group. Applied AND read back live (rule 12).
;
; DROPPED 2026-09-27 (Brief 7 P3 attempt 4). The A2 A/B (2026-09-25) measured
; NO change on the dark far band with this at 1 -- P4's own criterion is
; "keep if the far slopes gain shading, drop if not". And it is the prime
; suspect for the post-placement game-thread freeze: every mass
; add_instances since it was enabled (rocks 199k on 09-27, then 797k twice)
; left the editor unanswering for 7-19 min, while D3 on 09-22 (FarField 0)
; answered within 16 s of an 812k placement. Correlation, tested by this
; run: if attempt 4 saves, this line stays 0 and the lesson is written.
r.LumenScene.FarField=0

; --- landscape grass density maps: generated at RUNTIME (Brief 7 P3b, 2026-09-27) ---
; LandscapeGrassMapsBuilder.cpp:43 -- "Enable runtime grass map generation
; to save disk space and runtime memory. When enabled the grass density maps
; are not serialized and are built on the fly at runtime." Without it a
; -game run (and a cook) reads the GrassData SERIALISED in every
; LandscapeStreamingProxy, which only the editor rebuilds
; (IsGrassMapOutdated is WITH_EDITOR, LandscapeGrass.cpp:1167). Measured
; 2026-09-27: after M_Alpine8K gained four grass types, -game forest_floor
; GPU p90 read 12.363 ms against 12.377 before (open_max 12.707 vs 12.689)
; -- the new types were NOT spawning, the saved maps still described three.
; The alternative is re-saving ~1,024 landscape proxies after every grass
; change. With this at 1 the maps come from the material each session, in
; the editor and in -game alike, which is also the brief's own
; "runtime hierarchical generation". Applied by [SystemSettings] at startup;
; read back by the P3b perf re-run (rule 12).
grass.GrassMap.UseRuntimeGeneration=1

; --- the GI and reflection METHODS themselves ---
; These were 0 (OFF ENTIRELY) and were the single largest gap between
; this render and AAA terrain. Measured as render state: mean mae 0.11390
; = 38.2x the noise floor, 19 of 19 stations above it, with the two
; largest movers being the two stations documented as sitting in TERRAIN
; SHADOW — which is exactly where bounce contributes most, and is what
; makes that number evidence rather than just a big delta.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1

; --- hardware ray tracing + hit lighting (RTX 5080) ---
; LightingMode 1 = "calculate lighting at a ray hit point for GI and
; reflections" (LumenHardwareRayTracingCommon.cpp:33-38). Costs GPU;
; this machine has the budget and no longer has the iGPU it was tuned
; for.
r.Lumen.HardwareRayTracing=1
r.Lumen.HardwareRayTracing.LightingMode=1

; --- Lumen / real-time-sky-capture cached-lighting pre-exposure (Brief 7 P0c) ---
; The default 4.0 covers a usable exposure range of only ~[-8; 12] EV
; (PostProcessEyeAdaptation.cpp:201-208). This sunlit 8K alpine scene exposes
; at ~14.3 EV, past that ceiling, so the renderer draws the on-screen warning
; "Cached lighting in Lumen and real-time sky capture lighting is going to be
; clipped ..." (PostProcessEyeAdaptation.cpp:246-276): it fires when the scene
; ExposureEV falls outside [value-12, value+8]. Raising the value to 8 widens
; the range to ~[-4; 16] EV (the engine's own "fully covers physically based
; lighting range" figure), which covers 14-15 EV. Acceptance is the -game
; launch, not this line: the warning must be gone (rule 12/13).
r.EyeAdaptation.CachedLightingPreExposure=8

; --- virtual shadow maps: directional resolution bias ---
; Fractional ON PURPOSE. render_condition once displayed this as "-0"
; because its output format was {:.0f}; the SET was always correct.
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5

; --- Nanite tessellation, the gate landscape displacement rides on ---
; THE NAME MATTERS. `r.Nanite.AllowTessellation` DOES NOT EXIST in 5.8 —
; it appears in third-party standards docs and would sit here as an inert
; line that reads like a setting, while any check of it returned 0.0 and
; looked like "off". The real cvar is below (NaniteCullRaster.cpp:94).
r.Nanite.Tessellation=1

; NOT PINNED, DELIBERATELY: wp.Runtime.HLOD. It is an FAutoConsoleCommand,
; not a variable (HLODRuntimeSubsystem.cpp:150), so an entry here sets
; nothing and it cannot be read back to prove otherwise. Its handler also
; acts only on World->IsGameWorld(), so it does nothing in the editor.
; =====================================================================

; --- render at 100%. Was 70 (the single biggest iGPU saving) ---
; MEASURED 2026-08-11 on the 5080: 70 -> 100 is a MINOR lever on this
; scene, mae 4.1x the noise floor but only +1.3% edge energy with six
; stations LOSING it. Raised anyway because it is free on this GPU and
; the iGPU it was solved for is gone; do NOT cite it as a quality win.
r.ScreenPercentage=100

; --- cap editor frame rate so the GPU is not pinned at 100% idling ---
; STILL DOES NOT TAKE EFFECT. Root-caused 2026-08-07: this value applies
; and is then overwritten by Saved/Config/.../GameUserSettings.ini's
; FrameRateLimit=0, because UnrealEngine.cpp:12247 re-uses the previous
; set-reason and writes at the same priority. Left in place; see BACKLOG.
t.MaxFPS=45

; --- Nanite: 1 pixel per edge, the engine default. Was 4. ---
; THIS BECAME A LANDSCAPE RESOLUTION CAP ON 2026-08-11, when the
; landscape itself became Nanite. At 4 the terrain rasterises four times
; coarser per edge, and that is now TERRAIN SILHOUETTE, not just mesh
; silhouette. MEASURED: 4 -> 1 is worth mean +9.25% edge energy over 19
; stations, 17 of them gaining, and it recovers almost exactly the
; near-field detail the Nanite switch had cost —
;   verify_ground +36.7%   forest_floor +27.3%   sweep_0060 +22.7%
; which are the same three stations that lost most when Nanite came on.
; Artefact: _verify/20260811_quality_profile.txt
r.Nanite.MaxPixelsPerEdge=1

; --- PSO / shader pipeline cache: reuse compiled pipelines across runs
;     rather than paying the hitch every session.
r.ShaderPipelineCache.Enabled=1

; =====================================================================
; SINGLE-MACHINE SHADER COMPILATION  (added 2026-09-14)
; This project compiles shaders LOCALLY ONLY. Not a preference -- the
; distributed path on this machine SWALLOWS JOBS AND NEVER RETURNS THEM.
;
; MEASURED 2026-09-14: six `-game` launches hung before LoadMap, idle at
; ~0.7 s CPU per 20 s with zero ShaderCompileWorker processes, while
; %TEMP%\UnrealXGEWorkingDir accumulated 4,238 unconsumed shader-job .in
; files. IncrediBuild 10.36.3 (18514) is installed and running with
; MaxHelpers=0. The same machine built 32 HLOD commandlet batches clean
; the same night, because hlod_build_batched.base_args() passes
; -noxgecontroller and so never touches this path.
;
; THE GATE, ShaderCompiler.cpp:223-233 ShaderCompiler::IsRemoteCompilingAllowed():
;     static bool bDisabledFromCommandline =
;         FParse::Param(FCommandLine::Get(), TEXT("NoRemoteShaderCompile"));
;     if (bDisabledFromCommandline) return false;
;     return GShaderCompilerAllowDistributedCompilation != 0;
; so -NoRemoteShaderCompile and this cvar reach the SAME gate; the switch
; merely short-circuits ahead of it. Engine default is 1
; (ShaderCompiler.cpp:145).
;
; This is BROADER than -noxgecontroller, which disables only the XGE
; controller plugin: this gate covers every distributed backend.
; =====================================================================
r.ShaderCompiler.AllowDistributedCompilation=0

; =====================================================================
; SHADER COMPILE PRESSURE  (added 2026-08-02)
; The worker count is DERIVED, not set directly. ShaderCompiler.cpp:1238
;   if (NumVirtualCores > ShaderCompilerCoreCountThreshold)
;       NumUnusedShaderCompilingThreads = ceil(NumVirtualCores * Pct/100)
;   NumShaderCompilingThreads = NumVirtualCores - NumUnusedShaderCompilingThreads
;
; This machine reports 14 logical cores, and 14 > the default threshold
; of 12, so the PERCENTAGE path is the live one and the engine default of
; 50% was giving 14 - ceil(7.0) = 7 concurrent workers.
;
; 70% gives 14 - ceil(9.8) = 14 - 10 = 4 workers, which is the target.
; NumUnusedShaderCompilingThreads=10 is set as well so the OTHER branch
; (taken if the core count ever reports at or below the threshold) lands
; on the same 4. Both paths agree; neither is left to a default.
; =====================================================================
[DevOptions.Shaders]
PercentageUnusedShaderCompilingThreads=70
NumUnusedShaderCompilingThreads=10
NumUnusedShaderCompilingThreadsDuringGame=10
; Half the default batch of 10. Smaller batches hold less in memory at
; once, which matters more than file overhead at 15.4 GB.
MaxShaderJobBatchSize=5
; Idle workers exit after 10s instead of 20s, returning RAM sooner.
WorkerTimeToLive=10

; =====================================================================
; COLLISION PROFILE for scattered static foliage. Added 2026-08-16.
;
; WHY THIS EXISTS RATHER THAN "BlockAll + QUERY_ONLY".
; PHASE2_PLAN unit 6 asks for collision_enabled=QUERY_ONLY together with
; collision_profile_name=BlockAll. Those two cannot both hold:
;
;   BaseEngine.ini:3104   BlockAll declares CollisionEnabled=QueryAndPhysics
;   BodyInstance.cpp:4567 FBodyInstance::FixupData calls LoadProfileData
;                         on EVERY load
;   BodyInstance.cpp:4509 LoadProfileData -> UCollisionProfile::ReadConfig,
;                         which writes the PROFILE's CollisionEnabled,
;                         ObjectType and responses INTO the body instance
;   InstancedFoliage.cpp:806-812  UFoliageType::PostLoad calls FixupData
;
; So a foliage type saved as BlockAll + QueryOnly reads back correctly in
; the session that wrote it and silently becomes QueryAndPhysics on the
; next editor start. Green read-back, wrong state later — the defect class
; this project keeps paying for.
;
; A profile whose own CollisionEnabled IS QueryOnly makes the
; contradiction unrepresentable instead of guarding against it
; (non-negotiable 3).
;
; CustomResponses is deliberately EMPTY, which means Block on every
; channel — identical to BlockAll. Do NOT reach for the NoCollision
; profile's responses: it sets Visibility=Ignore and Camera=Ignore
; (BaseEngine.ini:3103), so trees would block movement while being
; invisible to visibility traces and to anything built on them.
;
; bCanModify=False matches how the engine ships its own built-ins and
; stops the profile being edited into disagreement in the editor UI.
; =====================================================================
[/Script/Engine.CollisionProfile]
+Profiles=(Name="FoliageBlockQueryOnly",CollisionEnabled=QueryOnly,ObjectTypeName="WorldStatic",CustomResponses=,HelpMessage="Scattered static foliage: blocks every channel, spatial queries only, never simulated.",bCanModify=False)


