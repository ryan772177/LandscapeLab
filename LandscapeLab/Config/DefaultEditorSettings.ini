; ---------------------------------------------------------------------
; DefaultEditorSettings.ini
;
; WHY THIS FILE EXISTS, AND WHY THE SAME KEYS ARE ALSO IN
; DefaultEditorPerProjectUserSettings.ini WHERE THEY DO NOTHING.
;
; UEditorPerformanceSettings is declared
;
;   UCLASS(minimalapi, config=EditorSettings, ...)
;       Editor/UnrealEd/Classes/Editor/EditorPerformanceSettings.h:31
;
; config=EditorSettings means its overrides are read from
; Default/EditorSettings.ini. This project wrote them into
; DefaultEditorPerProjectUserSettings.ini instead -- under the CORRECT
; section name, [/Script/UnrealEd.EditorPerformanceSettings], which is
; exactly why it looked right and was never suspected.
;
; That is the root cause of the defect CURRENT STATE has carried since
; 2026-08-10: "I had set bThrottleCPUWhenNotForeground=False in the ini and
; IT DID NOT DELIVER THE BEHAVIOUR". It was filed under non-negotiable 17
; (the file is not the state) and left there. Non-negotiable 17 is about a
; file recording an override that something else later overrides. This is
; simpler and worse: the override was never read at all, because it was in
; a file the class does not consult.
;
; MEASURED 2026-08-12, which is what turned the inference into a finding.
; With the editor unfocused, measure_frame_cost.py recorded
;
;     FrameTime  mean 333.33 ms, p50 333.33, max 333.54    = exactly 3 fps
;     editor CPU 0.08 CPU-seconds per wall-second
;
; 333.33 ms is not a cost, it is the editor's unfocused idle rate. Every
; frame-cost number taken on a backgrounded editor is a measurement of
; this, not of the scene.
;
; bThrottleCPUWhenNotForeground is read at EditorEngine.cpp:1807 as
;     bShouldDisableRendering = !FApp::HasFocus() && bThrottleCPUWhenNotForeground
; so False keeps the viewport rendering when the window is not focused --
; which is the condition every unattended run in this project executes in.
;
; bAllowSlateThrottling is the SECOND throttle, previously left True and
; explicitly not ruled on. It is set False here because it throttles
; viewport updates during UI interaction and this machine's captures are
; driven while other windows have focus. Its console mirror is
; Slate.bAllowThrottling (EditorPerformanceSettings.h:77 meta).
;
; NOT VERIFIED AT THE TIME OF WRITING. An ini records an override, not a
; state. The check that settles it is BEHAVIOURAL and not a property read:
; re-run measure_frame_cost.py with the editor backgrounded and see whether
; the CPU-per-wall-second ratio clears the throttle floor. A property
; read-back would only prove the value landed in the object, which is the
; weaker claim (non-negotiable 8).
; ---------------------------------------------------------------------
[/Script/UnrealEd.EditorPerformanceSettings]
bThrottleCPUWhenNotForeground=False
bAllowSlateThrottling=False
