; =====================================================================
; DefaultEditorPerProjectUserSettings.ini
; LOW-SPEC EDITOR PROFILE — added 2026-08-02
;
; Target: Intel Core Ultra 5 225U integrated GPU, 15.4 GB RAM.
;
; SCOPE, stated plainly: this file supplies PROJECT DEFAULTS that a
; per-user config layers on top of. It is not authoritative. The same
; values are set as console variables in DefaultEngine.ini's
; [SystemSettings], which IS applied every launch and cannot be shadowed
; by a per-user file — that is the copy to trust if the two ever
; disagree.
;
; Checked when this was written: the per-user
; %LOCALAPPDATA%\UnrealEngine\5.8\Saved\Config\WindowsEditor\*.ini had
; NO [ScalabilitySettings] section at all, so nothing was overriding
; these at the time of writing.
; =====================================================================

; ---------------------------------------------------------------------
; Editor scalability defaults. Scalability.cpp reads and writes group
; levels under this section name; 0 = Low, 1 = Medium, 2 = High,
; 3 = Epic.
;
; GI and Reflections are 0 rather than 1 deliberately — they are the two
; the Lumen shutdown in DefaultEngine.ini is aimed at, and leaving them
; at Medium would keep paying for a feature that is switched off.
; ---------------------------------------------------------------------
[ScalabilitySettings]
ViewDistanceQuality=1
AntiAliasingQuality=1
ShadowQuality=1
GlobalIlluminationQuality=0
ReflectionQuality=0
PostProcessQuality=1
TextureQuality=1
EffectsQuality=1
FoliageQuality=1
ShadingQuality=1

; ---------------------------------------------------------------------
; Editor performance.
;
; bThrottleCPUWhenNotForeground is the "Use Less CPU when in Background"
; checkbox (EditorPerformanceSettings.h:74). On a machine where the
; editor and a browser share one iGPU this is the difference between a
; usable desktop and a stuttering one.
;
; SET False 2026-08-10 ON THE 5080 MACHINE. The rationale above was the
; SHARED iGPU and it no longer applies: the editor and the desktop no
; longer contend for one adapter. This flag is the root cause of the
; capture-stall class (BACKLOG B-THROTTLE-GUARD) and cost a measured
; ~21x on the OmniBook -- 2.2 s of CPU per 20 s backgrounded against
; 46.3 s foregrounded. BACKLOG 2026-08-09 ruled it be set False EARLY on
; the new machine, before the first unattended run, rather than
; rediscovered. NOTE bAllowSlateThrottling below is a SECOND throttle and
; is deliberately left True -- it was not part of that ruling and no
; measurement here implicates it.
;
; ManualScreenPercentage is the EDITOR VIEWPORT mechanism for render
; scale (EditorPerformanceSettings.h:136-142). The r.ScreenPercentage=70
; cvar in DefaultEngine.ini is the global equivalent; this one is what
; the level viewport actually honours, so both are set to 70.
; ---------------------------------------------------------------------
[/Script/UnrealEd.EditorPerformanceSettings]
bThrottleCPUWhenNotForeground=False
bAllowSlateThrottling=True
bOverrideManualScreenPercentage=True
ManualScreenPercentage=70.000000
bOverridePIEScreenPercentage=True
bEnableVSync=False
; Cap the viewport's internal render resolution as a second ceiling, so
; a maximised window on a high-DPI display cannot quietly ask the iGPU
; for a 4K buffer.
bOverrideMaxViewportRenderingResolution=True
MaxViewportRenderingResolution=1920
; The performance monitor and the shared-DDC notifications both cost
; frames to tell you that you are short of frames.
bMonitorEditorPerformance=False
bEnableSharedDDCPerformanceNotifications=False
bShowFrameRateAndMemory=True
; Verified as belonging to THIS class, not LevelEditorViewportSettings
; where it was first written -- a key in the wrong section is ignored in
; silence, which reads exactly like a setting that applied.
bDisableRealtimeViewportsInRemoteSessions=True

; ---------------------------------------------------------------------
; Content browser: stop asset tiles animating. RealTimeThumbnails is a
; plain bool on UContentBrowserSettings (ContentBrowserSettings.h:30).
; With a few hundred assets on screen this is continuous GPU work for
; decoration.
; ---------------------------------------------------------------------
[/Script/UnrealEd.ContentBrowserSettings]
RealTimeThumbnails=False

; ---------------------------------------------------------------------
; Level editor viewports.
;
; HONEST LIMITATION: there is no project-level "realtime off by default"
; key in UE 5.8. Realtime is per-viewport state — `bIsRealtime` on
; FLevelEditorViewportInstanceSettings (LevelEditorViewportSettings.h:229)
; — and it is stored per user, per viewport, in the saved layout. Its
; struct default is already false (:129); what turns it on is the editor
; restoring a layout in which you previously enabled it.
;
; So the levers below are the real ones, and the remaining step is
; manual: Ctrl+R toggles realtime in a viewport, and the state sticks.
; If a viewport is spinning the GPU while you are not looking at it,
; that is the toggle.
; ---------------------------------------------------------------------
[/Script/UnrealEd.LevelEditorViewportSettings]
; Do not stream in high-res textures just because the mouse is over the
; viewport.
bPreviewSelectedCameras=False
; Cheaper than the default aa-heavy grid on a low-end GPU.
bHighlightWithBrackets=False
